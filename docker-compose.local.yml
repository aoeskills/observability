# Local mode, everything on this Mac in one project:
#   docker compose -f docker-compose.local.yml up -d        docker compose -f docker-compose.local.yml down
#   - the observer (docker-compose.yml) with storage settings from .local.env
#   - its bucket (RustFS) and Postgres as containers (docker-compose.local-storage.yml), so no network is needed
#   - this Mac's own agent (agent/, settings in agent/.env): the Mac is also a monitored machine
# Shared secrets (OpenObserve root, Grafana admin, LINE) come from .env, which must not hold storage settings: a value in
# .env wins over the included env files. OpenObserve talks to RustFS through the same S3 client it uses for GCS in prod.
include:
  - path: docker-compose.yml
    env_file: .local.env
  - path: docker-compose.local-storage.yml
    env_file: .local.env
  - path: [agent/docker-compose.yml, agent/docker-compose.mac.yml]
    env_file: agent/.env

services:
  db-init:
    depends_on:
      postgres: { condition: service_healthy }

  openobserve:
    depends_on:
      bucket-init: { condition: service_completed_successfully }

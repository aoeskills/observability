# The agent for one machine (see config.yaml), step by step in docs/agent-runbook.md. Settings come from agent/.env (copy
# .env.example), the client certificate from agent/certs (key + CSR made on the machine, signed by the collector).
# On a machine this directory is ~/agent with only the files the runbook copies, never a clone of the repo.
#   Linux:      docker compose up -d     agent + node_exporter (profile node-exporter, on via COMPOSE_PROFILES in agent/.env)
#               + blackbox-exporter (service probes, targets in agent/probes/*.yml)
#   macOS:      docker compose -f docker-compose.yml -f docker-compose.mac.yml up -d; node_exporter is a Homebrew service there
# Every container's own output (`docker logs`) is capped at 50 MB: 5 files of 10 MB, the oldest is dropped. It is only
# the services' stdout (OpenObserve alone logs every request at INFO, ~1.2 GB/day uncapped), not the monitoring data.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  otel-agent:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-agent
    logging: *logging
    restart: unless-stopped
    # root inside the container: the disk-queue volume is created root-owned and the client key is readable by its
    # owner only (0600); the image's default user (10001) could use neither. Machine agents commonly run as root.
    user: "0:0"
    network_mode: host
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      # host.name override for the resourcedetection env detector; unset = detected (cloud instance name, else OS hostname)
      OTEL_RESOURCE_ATTRIBUTES: ${HOST_NAME:+host.name=${HOST_NAME}}
      SERVICE_NAMESPACE: ${SERVICE_NAMESPACE:?set in agent/.env}
      GATEWAY_ENDPOINT: ${GATEWAY_ENDPOINT:?set in agent/.env}
      NODE_EXPORTER_TARGET: ${NODE_EXPORTER_TARGET:-127.0.0.1:9100}
      AGENT_OTLP_BIND: ${AGENT_OTLP_BIND:-127.0.0.1:4318}
      BLACKBOX_TARGET: ${BLACKBOX_TARGET:-127.0.0.1:9115}
    volumes:
      - ./config.yaml:/etc/otelcol/config.yaml:ro
      - ${AGENT_CERTS_DIR:-./certs}:/certs:ro
      - ./probes:/etc/otelcol/probes:ro # service probe targets (*.yml), see probes/example.yml.sample
      - agent-queue:/var/lib/otelcol

  node-exporter:
    # The machine's own status for a Linux VM; only listens on 127.0.0.1, the agent scrapes it. Skipped when the VM already
    # runs a node_exporter (remove COMPOSE_PROFILES from agent/.env, point NODE_EXPORTER_TARGET at it).
    image: prom/node-exporter:latest
    container_name: node-exporter
    logging: *logging
    profiles: [node-exporter]
    restart: unless-stopped
    network_mode: host
    pid: host
    command: ["--path.rootfs=/host", "--web.listen-address=127.0.0.1:9100", "--no-collector.thermal_zone"]
    volumes:
      - /:/host:ro,rslave

  blackbox-exporter:
    # Probes this machine's services for the agent (targets: agent/probes/*.yml; only HTTP 200 = up). Listens on 127.0.0.1
    # only; the agent scrapes it once a minute and pushes probe_success with everything else.
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    logging: *logging
    restart: unless-stopped
    network_mode: host
    command: ["--config.file=/etc/blackbox_exporter/config.yml", "--web.listen-address=127.0.0.1:9115"]
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro

volumes:
  agent-queue:

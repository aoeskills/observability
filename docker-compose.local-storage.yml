# The bucket (RustFS, S3 API) and the Postgres server of local mode, as containers, so the stack needs no network.
# Included by docker-compose.local.yml with .local.env, which also gives OpenObserve / Grafana the matching settings.
# Every container's own output (`docker logs`) is capped at 50 MB: 5 files of 10 MB, the oldest is dropped. It is only
# the services' stdout (OpenObserve alone logs every request at INFO, ~1.2 GB/day uncapped), not the monitoring data.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  bucket:
    image: rustfs/rustfs:1.0.1
    container_name: bucket
    logging: *logging
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${O2_S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${O2_S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - 127.0.0.1:9001:9001 # web console to browse the bucket (login: O2_S3_ACCESS_KEY / O2_S3_SECRET_KEY in .local.env)
    volumes:
      - bucket-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  bucket-init:
    # OpenObserve never creates its bucket. One-shot: create it (an existing bucket is fine), signed with curl's SigV4.
    image: rustfs/rustfs:1.0.1
    container_name: bucket-init
    logging: *logging
    restart: "no"
    environment:
      S3_USER: ${O2_S3_ACCESS_KEY}:${O2_S3_SECRET_KEY}
      S3_BUCKET: ${O2_S3_BUCKET}
      S3_REGION: ${O2_S3_REGION}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        code=$$(curl -s -o /dev/stderr -w '%{http_code}' -X PUT http://bucket:9000/$$S3_BUCKET
        --aws-sigv4 aws:amz:$$S3_REGION:s3 --user $$S3_USER);
        echo "create bucket: HTTP $$code"; [ "$$code" = 200 ] || [ "$$code" = 409 ]
    depends_on:
      bucket: { condition: service_healthy }

  postgres:
    # The one Postgres server; db-init creates the openobserve, grafana and monitoring databases in it.
    image: postgres:17-alpine
    container_name: postgres
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  bucket-data:
  postgres-data:
